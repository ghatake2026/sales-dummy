<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>販売管理システム - 受注入力</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #1f2933;
      font-family: "Meiryo", "Yu Gothic", system-ui, sans-serif;
      font-size: 13px;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 20px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .form-message {
      display: none;
      margin: 0 0 12px;
      border: 1px solid #b8d8c0;
      border-radius: 4px;
      padding: 10px 12px;
      background: #eef9f1;
      color: #1d6b35;
      font-weight: 700;
    }

    .form-message.error {
      border-color: #f0b4b4;
      background: #fff0f0;
      color: #a62020;
    }

    .form-message.show {
      display: block;
    }

    button {
      min-width: 86px;
      border: 1px solid #b7c0ca;
      border-radius: 4px;
      padding: 7px 16px;
      background: #fff;
      color: #1f2933;
      cursor: pointer;
      font-weight: 700;
    }

    button.primary {
      border-color: #2780b9;
      background: #2d9cdb;
      color: #fff;
    }

    .form-shell {
      border: 1px solid #d8dee5;
      background: #fff;
    }

    .section {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      gap: 8px 12px;
      border-top: 1px solid #d8dee5;
      padding: 8px 14px;
    }

    .section:first-child {
      border-top: 0;
    }

    .section-title {
      margin: 0;
      color: #52616f;
      font-size: 13px;
      font-weight: 700;
      line-height: 28px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 150px minmax(180px, 360px) 130px minmax(180px, 1fr);
      align-items: center;
      gap: 6px 10px;
    }

    .compact-grid {
      display: grid;
      gap: 6px 10px;
    }

    .grid-four {
      grid-template-columns: 1fr 1.45fr 1.2fr 0.7fr;
    }

    .grid-three {
      grid-template-columns: 0.75fr 1.9fr 1fr;
    }

    .grid-address {
      grid-template-columns: 0.8fr 0.8fr 2fr;
    }

    .grid-two {
      grid-template-columns: 1fr 1fr;
    }

    .grid-one {
      grid-template-columns: 1fr;
    }

    .form-stack {
      display: grid;
      gap: 7px;
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;
      margin: 0 0 2px;
      text-align: left;
      font-size: 12px;
      line-height: 1.25;
    }

    label {
      text-align: right;
      font-weight: 700;
      white-space: nowrap;
    }

    label.required::before {
      content: "*";
      color: #d40000;
      margin-right: 4px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 24px;
      border: 1px solid #bfc7d1;
      border-radius: 3px;
      padding: 2px 7px;
      background: #fff;
      color: #1f2933;
      font: inherit;
    }

    textarea {
      min-height: 44px;
      resize: vertical;
    }

    .wide {
      grid-column: span 3;
    }

    .full {
      grid-column: span 3;
    }

    .inline {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .code {
      max-width: none;
      flex: 1 1 auto;
    }

    .textarea-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .textarea-toolbar {
      display: flex;
      justify-content: flex-end;
    }

    .textarea-action {
      min-width: 150px;
      padding: 5px 10px;
      background: #eef7fd;
      border-color: #9ecce7;
      color: #155a80;
      font-size: 12px;
    }

    .radio-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      min-height: 28px;
    }

    .radio-row label {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      text-align: left;
      font-weight: 400;
    }

    .radio-row input {
      width: auto;
      min-height: 0;
    }

    .hint {
      color: #66788a;
      font-size: 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.45);
      z-index: 10;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(920px, 100%);
      max-height: 90vh;
      overflow: auto;
      border: 1px solid #c9d2dc;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.28);
    }

    .modal-header,
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #d8dee5;
    }

    .modal-footer {
      justify-content: flex-end;
      border-top: 1px solid #d8dee5;
      border-bottom: 0;
    }

    .modal-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .modal-body {
      padding: 16px;
      overflow-x: auto;
    }

    .condition-table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    .condition-table th,
    .condition-table td {
      border: 1px solid #cbd5df;
      padding: 8px 10px;
      text-align: left;
    }

    .condition-table th {
      background: #edf1f5;
      font-weight: 700;
    }

    .condition-table input[type="checkbox"] {
      width: auto;
      min-height: 0;
    }

    @media (max-width: 760px) {
      .page {
        padding: 12px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      button {
        flex: 1;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .section {
        grid-template-columns: 1fr;
      }

      .section-title {
        line-height: 1.4;
      }

      .grid-four,
      .grid-three,
      .grid-address,
      .grid-two {
        grid-template-columns: 1fr;
      }

      label {
        text-align: left;
      }

      .wide,
      .full {
        grid-column: auto;
      }

      .inline {
        align-items: stretch;
        flex-direction: column;
      }

      .code {
        max-width: none;
        flex-basis: auto;
      }

      .textarea-toolbar {
        justify-content: stretch;
      }

      .textarea-action {
        width: 100%;
      }

    }
  </style>
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <h1>受注入力</h1>
      <div class="actions">
        <button type="button" id="openOrders">注文リスト</button>
        <button type="button">キャンセル</button>
        <button type="submit" form="orderForm" class="primary">登録</button>
      </div>
    </div>

    <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>

    <form id="orderForm" class="form-shell">
      <section class="section">
        <p class="section-title">基本情報</p>
        <div class="form-stack">
          <div class="compact-grid grid-four">
            <div class="field">
              <label for="slipType" class="required">伝票区分</label>
              <select id="slipType" name="slipType">
                <option value="" selected>選択してください</option>
                <option>一般</option>
                <option>サンプル</option>
              </select>
            </div>

            <div class="field">
              <label for="department" class="required">部署</label>
              <select id="department" name="department">
                <option value="" selected>選択してください</option>
                <option>福岡支店 営業課</option>
                <option>名古屋支店 営業課</option>
                <option>大阪支店 営業課</option>
                <option>仙台支店 営業課</option>
              </select>
            </div>

            <div class="field">
              <label for="orderStaff" class="required">受注担当者</label>
              <select id="orderStaff" name="orderStaff">
                <option value="" selected>選択してください</option>
                <option>宮﨑 博考</option>
                <option>山田 太郎</option>
                <option>鈴木 一郎</option>
                <option>高橋 大輔</option>
              </select>
            </div>

            <div class="field">
              <label for="rank" class="required">ランク</label>
              <select id="rank" name="rank">
                <option value="" selected>選択してください</option>
                <option>A</option>
                <option>B</option>
                <option>C</option>
                <option>D</option>
                <option>E</option>
              </select>
            </div>
          </div>

          <div class="compact-grid grid-two">
            <div class="field">
              <label for="amountBasis" class="required">金額根拠</label>
              <select id="amountBasis" name="amountBasis">
                <option value="" selected>選択してください</option>
                <option>見積書</option>
                <option>内示関連書類</option>
                <option>注文書</option>
                <option>その他</option>
              </select>
            </div>

            <div class="field">
              <label for="amountBasisNote">金額根拠補足</label>
              <input id="amountBasisNote" name="amountBasisNote" type="text" placeholder="補足">
            </div>
          </div>

          <div class="compact-grid grid-one">
            <div class="field">
              <label for="competitor">競合先</label>
              <input id="competitor" name="competitor" type="text" placeholder="競合先">
            </div>
          </div>

          <div class="compact-grid grid-three">
            <div class="field">
              <label for="customerCode" class="required">取引先コード</label>
              <select id="customerCode" name="customerCode" class="code">
                <option value="" selected>選択してください</option>
                <option value="0000000">0000000</option>
                <option value="1111111">1111111</option>
                <option value="2222222">2222222</option>
                <option value="3333333">3333333</option>
                <option value="4444444">4444444</option>
                <option value="5555555">5555555</option>
                <option value="6666666">6666666</option>
                <option value="7777777">7777777</option>
                <option value="8888888">8888888</option>
                <option value="9999999">9999999</option>
              </select>
            </div>

            <div class="field">
              <label for="customerName" class="required">取引先名称</label>
              <select id="customerName" name="customerName">
                <option value="" selected>選択してください</option>
                <option>VACHシステムズ株式会社 近畿支店</option>
                <option>大和建設株式会社 東北支店</option>
                <option>日本冷蔵装置株式会社 九州支店</option>
                <option>田中建築株式会社 北陸支店</option>
                <option>東都設備工業株式会社 四国支店</option>
                <option>西日本物流株式会社 中国支店</option>
                <option>北辰食品株式会社 東海支店</option>
                <option>青葉メンテナンス株式会社 関東支店</option>
                <option>中央電機サービス株式会社 北海道支店</option>
                <option>未来環境システム株式会社 沖縄支店</option>
              </select>
            </div>

            <div class="field">
              <label for="customerContact">取引先担当者</label>
              <input id="customerContact" name="customerContact" type="text" placeholder="取引先担当者">
            </div>
          </div>

          <div class="compact-grid grid-four">
            <div class="field">
              <label for="orderNumber">取引先注文番号</label>
              <input id="orderNumber" name="orderNumber" type="text" placeholder="例：ORD-000001">
            </div>

            <div class="field">
              <label for="propertyName" class="required">物件名称</label>
              <input id="propertyName" name="propertyName" type="text" placeholder="物件名称">
            </div>

            <div class="field">
              <label for="expectedOrderDate" class="required">受注予定日</label>
              <input id="expectedOrderDate" name="expectedOrderDate" type="date">
            </div>

            <div class="field">
              <label for="expectedSalesDate" class="required">売上予定日</label>
              <input id="expectedSalesDate" name="expectedSalesDate" type="date">
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <p class="section-title">分類・納入情報</p>
        <div class="form-stack">
          <div class="compact-grid grid-one">
            <div class="field">
              <label for="tradeTerms">取引条件</label>
              <div class="textarea-panel">
                <div class="textarea-toolbar">
                  <button type="button" id="openTradeTerms" class="textarea-action">取引条件から選択</button>
                </div>
                <textarea id="tradeTerms" name="tradeTerms" placeholder="取引条件"></textarea>
              </div>
            </div>
          </div>

          <div class="compact-grid grid-one">
            <div class="field">
              <label for="deliveryName">納入先名称</label>
              <input id="deliveryName" name="deliveryName" type="text" placeholder="納入先名">
            </div>
          </div>

          <div class="compact-grid grid-address">
            <div class="field">
              <label for="postalCode">郵便番号</label>
              <input id="postalCode" name="postalCode" type="text" placeholder="1234567">
            </div>

            <div class="field">
              <label for="prefecture">都道府県</label>
              <input id="prefecture" name="prefecture" type="text" placeholder="都道府県">
            </div>

            <div class="field">
              <label for="address">住所</label>
              <input id="address" name="address" type="text" placeholder="住所">
            </div>
          </div>

          <div class="compact-grid grid-two">
            <div class="field">
              <label for="receivingContact">荷受担当者</label>
              <input id="receivingContact" name="receivingContact" type="text" placeholder="荷受担当者">
            </div>

            <div class="field">
              <label for="phone">連絡先</label>
              <input id="phone" name="phone" type="text" placeholder="0123456789">
            </div>
          </div>
        </div>
      </section>

    </form>
  </main>

  <div id="tradeTermsModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="tradeTermsModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="tradeTermsModalTitle" class="modal-title">取引条件から選択</h2>
      </div>
      <div class="modal-body">
        <table class="condition-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAllConditions" aria-label="すべて選択"></th>
              <th>金額（以上）</th>
              <th>金額（未満）</th>
              <th>締日</th>
              <th>支払月</th>
              <th>支払日</th>
              <th>支払区分</th>
              <th>サイト</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><input type="checkbox" class="condition-check" aria-label="取引条件を選択"></td>
              <td>0</td>
              <td>0</td>
              <td>末</td>
              <td>翌月</td>
              <td>15</td>
              <td>電子記録債権</td>
              <td>120</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancelTradeTerms">キャンセル</button>
        <button type="button" id="okTradeTerms" class="primary">OK</button>
      </div>
    </div>
  </div>

  <script>
    const customerCode = document.getElementById("customerCode");
    const customerName = document.getElementById("customerName");
    const orderForm = document.getElementById("orderForm");
    const formMessage = document.getElementById("formMessage");
    const openOrders = document.getElementById("openOrders");
    const openTradeTerms = document.getElementById("openTradeTerms");
    const tradeTerms = document.getElementById("tradeTerms");
    const tradeTermsModal = document.getElementById("tradeTermsModal");
    const okTradeTerms = document.getElementById("okTradeTerms");
    const cancelTradeTerms = document.getElementById("cancelTradeTerms");
    const selectAllConditions = document.getElementById("selectAllConditions");
    const conditionChecks = document.querySelectorAll(".condition-check");

    customerName.addEventListener("change", () => {
      customerCode.selectedIndex = customerName.selectedIndex;
    });

    function showFormMessage(message, type = "success") {
      formMessage.textContent = message;
      formMessage.className = `form-message show${type === "error" ? " error" : ""}`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetOrderForm() {
      orderForm.reset();
      customerCode.selectedIndex = 0;
      customerName.selectedIndex = 0;
      selectAllConditions.checked = false;
      conditionChecks.forEach((checkbox) => {
        checkbox.checked = false;
      });
    }

    openOrders.addEventListener("click", () => {
      window.location.href = "/orders";
    });

    orderForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      formMessage.className = "form-message";
      formMessage.textContent = "";

      const formData = new FormData(orderForm);
      const payload = {
        customerName: formData.get("customerName"),
        customerContact: formData.get("customerContact"),
        orderNumber: formData.get("orderNumber"),
        propertyName: formData.get("propertyName"),
        deliveryName: formData.get("deliveryName"),
        postalCode: formData.get("postalCode"),
        prefecture: formData.get("prefecture"),
        address: formData.get("address"),
        receivingContact: formData.get("receivingContact"),
        phone: formData.get("phone"),
        expectedSalesDate: formData.get("expectedSalesDate"),
      };

      try {
        const response = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const result = await response.json();

        if (!response.ok) {
          showFormMessage(`登録に失敗しました。${result.message || result.error || ""}`, "error");
          return;
        }

        resetOrderForm();
        showFormMessage("登録完了、次のデータを入力してください");
      } catch (error) {
        showFormMessage(`登録に失敗しました。${error.message}`, "error");
      }
    });

    openTradeTerms.addEventListener("click", () => {
      tradeTermsModal.classList.add("open");
    });

    okTradeTerms.addEventListener("click", () => {
      const selectedRows = Array.from(document.querySelectorAll(".condition-check:checked"));
      const rows = selectedRows.length ? selectedRows : Array.from(conditionChecks);
      tradeTerms.value = rows.map((checkbox) => {
        const cells = Array.from(checkbox.closest("tr").querySelectorAll("td")).slice(1);
        return cells.map((cell) => cell.textContent.trim()).join(",");
      }).join("\n");
      tradeTermsModal.classList.remove("open");
    });

    cancelTradeTerms.addEventListener("click", () => {
      tradeTermsModal.classList.remove("open");
    });

    selectAllConditions.addEventListener("change", () => {
      conditionChecks.forEach((checkbox) => {
        checkbox.checked = selectAllConditions.checked;
      });
    });
  </script>
</body>
</html>
