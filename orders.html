<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>販売管理システム - 注文リスト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #1f2933;
      font-family: "Meiryo", "Yu Gothic", system-ui, sans-serif;
      font-size: 13px;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    a,
    button {
      border: 1px solid #b7c0ca;
      border-radius: 4px;
      padding: 7px 14px;
      background: #fff;
      color: #1f2933;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8dee5;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    th,
    td {
      border-bottom: 1px solid #d8dee5;
      padding: 8px 10px;
      text-align: left;
    }

    th {
      background: #edf1f5;
      font-weight: 700;
    }

    .delete-button {
      border-color: #d34a4a;
      color: #b42323;
    }

    .status {
      margin: 0 0 10px;
      color: #52616f;
    }

    .empty {
      padding: 24px;
      color: #66788a;
      text-align: center;
    }

    @media (max-width: 760px) {
      .page {
        padding: 12px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <h1>注文リスト</h1>
      <a href="/">受注入力へ戻る</a>
    </div>

    <p id="status" class="status">読み込み中...</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>取引先名称</th>
            <th>取引先担当者</th>
            <th>取引先注文番号</th>
            <th>物件名称</th>
            <th>納入先名称</th>
            <th>郵便番号</th>
            <th>都道府県</th>
            <th>住所</th>
            <th>荷受担当</th>
            <th>電話番号</th>
            <th>売上予定日</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
      <div id="empty" class="empty" hidden>注文データがありません。</div>
    </div>
  </main>

  <script>
    const columns = [
      "customerName",
      "customerContact",
      "orderNumber",
      "propertyName",
      "deliveryName",
      "postalCode",
      "prefecture",
      "address",
      "receivingContact",
      "phone",
      "expectedSalesDate",
    ];

    const status = document.getElementById("status");
    const ordersBody = document.getElementById("ordersBody");
    const empty = document.getElementById("empty");

    function appendCell(row, value) {
      const cell = document.createElement("td");
      cell.textContent = value || "";
      row.appendChild(cell);
    }

    function appendDeleteCell(row, order) {
      const cell = document.createElement("td");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "delete-button";
      button.textContent = "削除";
      button.addEventListener("click", () => deleteOrder(order));
      cell.appendChild(button);
      row.appendChild(cell);
    }

    async function deleteOrder(order) {
      const customerName = order.customerName || "";
      const confirmed = window.confirm(`${customerName} のデータを削除しますか？`);

      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(`/api/orders?id=${encodeURIComponent(order.id)}`, {
          method: "DELETE",
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || data.error || "削除に失敗しました。");
        }

        await loadOrders();
      } catch (error) {
        alert(error.message);
      }
    }

    async function loadOrders() {
      try {
        const response = await fetch("/api/orders");
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "注文データを取得できませんでした。");
        }

        ordersBody.innerHTML = "";
        data.forEach((order) => {
          const row = document.createElement("tr");
          columns.forEach((column) => appendCell(row, order[column]));
          appendDeleteCell(row, order);
          ordersBody.appendChild(row);
        });

        empty.hidden = data.length > 0;
        status.textContent = `${data.length}件表示中`;
      } catch (error) {
        status.textContent = error.message;
        empty.hidden = false;
      }
    }

    loadOrders();
  </script>
</body>
</html>
